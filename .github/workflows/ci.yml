name: CI

on:
  pull_request:
    branches: [main]
  # Deploy は本番停止中のため自動実行していない。main のコミットに検証結果が
  # 何も残らなくなるので、CI は push でも走らせる。
  push:
    branches: [main]
  workflow_call:

env:
  # Dockerfile / ローカルと同じバージョンに揃える
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nokoroa-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nokoroa-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://nokoroa.com

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nokoroa-backend

    # e2e が実DBを使うため pgvector 同梱イメージを立てる
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nokoroa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nokoroa_test
      JWT_SECRET: ci-only-jwt-secret-value-at-least-32-chars
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nokoroa-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test

      - name: Apply migrations
        run: npx prisma migrate deploy

      # pgvector の HNSW インデックスは Unsupported 型のため schema.prisma で
      # 宣言できず、prisma migrate diff は常にその DROP INDEX を生成する。
      # 誤って取り込むとエラーは出ないまま類似度検索が全件走査に落ちるため、
      # マイグレーション適用後に実在を確認する。
      - name: Verify pgvector HNSW index survives migrations
        run: |
          count=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM pg_indexes WHERE indexname = 'post_embedding_embedding_idx'")
          if [ "$count" != "1" ]; then
            echo "::error::post_embedding_embedding_idx が存在しません。マイグレーションに DROP INDEX が紛れ込んでいないか確認してください"
            exit 1
          fi

      - name: E2E test
        run: npm run test:e2e

      - name: Build
        run: npm run build

  ai:
    name: AI Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nokoroa-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

      # deploy.yml が本番へ push するのと同じ条件 (ARM64) でビルドし、
      # Dockerfile の破損を PR の時点で検知する。push はしない。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./nokoroa-ai
          platforms: linux/arm64
          push: false

  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Format check
        run: terraform fmt -check -recursive

      # 本番停止中でも「apply すれば再構築できる」ことを毎コミット検証する。
      # -backend=false で state に触れずに設定の妥当性だけを確認し、
      # -lockfile=readonly でコミット済みの .terraform.lock.hcl と一致することを保証する。
      - name: Init (backend なし)
        working-directory: terraform/envs/prod
        run: terraform init -backend=false -lockfile=readonly

      - name: Validate
        working-directory: terraform/envs/prod
        run: terraform validate
