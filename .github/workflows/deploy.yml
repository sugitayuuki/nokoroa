name: Deploy

# 本番は runtime_enabled で停止・再開するサイクル運用で、停止中は ECS クラスタも
# サービスも存在しない。main への push で自動実行すると、ECR への push だけ成功して
# （ECR は停止しても残す）サービス更新が失敗し、適用されないタスク定義リビジョンが
# 積み上がる。そのため自動トリガーは外して手動実行のみにしている。
#
# 停止が既定の運用である限り push トリガーは戻せない。戻すなら、先に
# 「サービスが存在しなければ skip」のガードをこのワークフローに入れること。
# 詳細は terraform/README.md「停止と再開」。
on:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_BACKEND_REPOSITORY: nokoroa-backend
  ECR_FRONTEND_REPOSITORY: nokoroa-frontend
  # AI はバックエンドタスク内のサイドカーなので、専用の service / task definition は無い
  ECR_AI_REPOSITORY: nokoroa-ai
  ECS_CLUSTER: nokoroa-prod-cluster
  ECS_BACKEND_SERVICE: nokoroa-prod-backend
  ECS_FRONTEND_SERVICE: nokoroa-prod-frontend
  ECS_BACKEND_TASK_DEFINITION: nokoroa-prod-backend
  ECS_FRONTEND_TASK_DEFINITION: nokoroa-prod-frontend

jobs:
  ci:
    name: CI Check
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # backend / AI は frontend と違い cache-from / cache-to を設定していない。
      # ランナーは毎回使い捨てでキャッシュのエクスポート先が無く、ビルドはどのみち
      # 素の状態から始まるため、no-cache: true はその前提を明示する保険（Prisma
      # クライアント生成と apt / pip のネイティブ依存が、途中から復元されたレイヤで
      # 古いまま残るのを確実に避ける）。速度が問題になったら frontend と同じ
      # type=gha を入れて no-cache を外す。非対称なのは意図であって設定漏れではない。
      - name: Build and push Backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./nokoroa-backend
          platforms: linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest

      # AI は backend と同一タスクのサイドカー。ここでビルドしないと、
      # nokoroa-ai/ の変更が永久に本番へ反映されない。
      - name: Build and push AI image
        id: build-ai
        uses: docker/build-push-action@v5
        with:
          context: ./nokoroa-ai
          platforms: linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_AI_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_AI_REPOSITORY }}:latest

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_BACKEND_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      # 1 タスクに 2 コンテナあるため、レンダリングを 2 段に連鎖させる。
      # 1 回だけだと更新しなかった側のイメージが古いまま残る。
      - name: Update task definition with new backend image
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Update task definition with new AI image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          container-name: ai
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_AI_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./nokoroa-frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest
          # NEXT_PUBLIC_* は Next.js がビルド時にバンドルへ埋め込むため、
          # ECS のランタイム env では上書きできない。値の指定はここに一本化している
          # （Terraform 側のタスク定義には意図的に持たせていない）。
          # terraform の app_domain を変更する場合はこの値も併せて変更すること
          # (ci.yml の build ジョブにも同じ NEXT_PUBLIC_API_URL がある)
          # backend / AI と違いここだけ type=gha のキャッシュを使う。Next.js の
          # ビルドが 3 つの中で最も重く、かつ build-args はキャッシュキーに含まれる
          # ため、下の NEXT_PUBLIC_* を変えれば確実にキャッシュは無効化される。
          build-args: |
            NEXT_PUBLIC_API_URL=https://nokoroa.com
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_FRONTEND_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: frontend
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
