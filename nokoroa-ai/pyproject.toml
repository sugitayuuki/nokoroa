[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort (import 順)
    "UP",   # pyupgrade (古い書き方の検出)
    "B",    # flake8-bugbear (バグになりやすい書き方)
    "ASYNC", # async 固有の落とし穴 (イベントループを塞ぐ呼び出し等)
    "RUF",
]
ignore = [
    # 日本語のプロンプト・コメントで全角括弧を使うのは正しい表記であり、
    # 半角への置換を促す指摘は本プロジェクトでは常に誤検知になる。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# テストでは長いリテラルやフィクスチャの都合で行長を超えることがある
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# pyright の設定はここには書かない。pyrightconfig.json が同じディレクトリに
# あると pyright は [tool.pyright] を一切読まないため、両方に書くと片方が
# 黙って無効になる (実際にこの節の typeCheckingMode は効いていなかった)。
# 設定は pyrightconfig.json に一本化する。
