services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run start:dev
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nokoroa_db
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-local-development-only-secret}
      - NODE_ENV=development
      - PORT=4000
      - AI_SERVICE_URL=http://ai:8000
      # AIサービスとの内部通信用トークン。ai サービスの INTERNAL_API_KEY と一致させる。
      - INTERNAL_AI_TOKEN=${INTERNAL_AI_TOKEN:-local-internal-token}
    depends_on:
      - postgres
      - ai

  postgres:
    # pgvector拡張が必要（prisma/migrations の CREATE EXTENSION vector）。
    # 素の postgres イメージでは当該マイグレーションが適用できない。
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nokoroa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai:
    container_name: nokoroa-ai
    build:
      context: ../nokoroa-ai
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # backend の INTERNAL_AI_TOKEN と一致させる。未設定だと全リクエストが503になる。
      - INTERNAL_API_KEY=${INTERNAL_AI_TOKEN:-local-internal-token}

volumes:
  postgres_data:
  node_modules:
